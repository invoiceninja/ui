on:
  release:
    types: [released]

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy .env file
        run: |
          cp .env.example .env

      - name: Prepare React Application
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm i
          npm run build

      - name: Cleanup
        run: |
          sudo rm -rf .env

      - name: Verify self-hosted bundle excludes Sentry
        run: |
          if find dist/react -maxdepth 1 -type f -iname '*sentry*' -print -quit | head -n 1 | read -r; then
            echo 'Self-hosted bundle unexpectedly contains Sentry.'
            exit 1
          fi

      - name: Build project
        run: |
          zip -r ./invoiceninja-react.zip dist/

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            invoiceninja-react.zip
