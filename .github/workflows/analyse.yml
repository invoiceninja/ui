# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build, test & lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, redesign]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Checkout DocuNinja builder2.0 (main)
        uses: actions/checkout@v4
        with:
          repository: DocuNinja/builder2.0
          ref: main
          token: ${{ secrets.BUILDER_ACCESS_TOKEN }}
          path: builder2.0
      - name: Build DocuNinja builder2.0
        working-directory: builder2.0
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install
          npm run build
          npm pack
      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm install
      - name: Use built DocuNinja builder2.0 instead of npm package
        run: |
          TARBALL=$(ls builder2.0/*.tgz | head -n 1)
          rm -rf node_modules/@docuninja/builder2.0
          mkdir -p node_modules/@docuninja/builder2.0
          tar -xzf "$TARBALL" -C node_modules/@docuninja/builder2.0 --strip-components=1
      - run: npm run build
      - name: Verify self-hosted bundle excludes Sentry
        run: |
          if find dist/react -maxdepth 1 -type f -iname '*sentry*' -print -quit | head -n 1 | read -r; then
            echo 'Self-hosted bundle unexpectedly contains Sentry.'
            exit 1
          fi
      - run: npm run test
      - run: npm run lint
